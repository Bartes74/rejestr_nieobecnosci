# On-premise dev stack. Serwisy api/web dołożymy, gdy powstaną ich Dockerfile.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nieobecnosci
      POSTGRES_PASSWORD: nieobecnosci
      POSTGRES_DB: nieobecnosci
    ports: ["5440:5432"]
    volumes: ["dbdata:/var/lib/postgresql/data"]
  adminer:
    image: adminer
    ports: ["8080:8080"]
    depends_on: ["db"]

volumes:
  dbdata:
