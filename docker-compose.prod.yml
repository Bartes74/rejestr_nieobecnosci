# Wdrożenie on-prem (1 VM): api + web(Caddy/TLS) + postgres.
# Uruchom:  docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# (--env-file dostarcza zmienne do interpolacji ${...}; api dodatkowo czyta .env.prod jako env_file).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nieobecnosci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nieobecnosci
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.prod
    depends_on: [db]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    depends_on: [api]
    restart: unless-stopped

volumes:
  dbdata:
