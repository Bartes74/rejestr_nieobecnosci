<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nieobecności</title>
    <!-- Kroje leżą pod arkuszem, który jest pod bundlem JS — bez preloadu przeglądarka
         dowiaduje się o nich dopiero w trzecim kroku łańcucha. Oba podzbiory Archivo są
         krytyczne: polskie „ó" jest w latin, a „ą ć ę ł ń ś ź ż" w latin-ext. -->
    <link rel="preload" href="/fonts/archivo-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/archivo-variable-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <!-- IBM Plex Mono niesie każdą liczbę i każdy nagłówek kolumny, ale był wykrywany dopiero
         przy pierwszym rysowaniu — kolumny liczb przeskakiwały po podmianie kroju. Preload
         obejmuje dwa z sześciu plików: wagę 400 latin (cyfry, daty, identyfikatory) i wagę 700
         latin-ext (mikroetykiety, w których siedzą polskie znaki: „ŹRÓDŁO", „ZAŁĄCZNIK").
         Reszta wag schodzi normalnie — preload wszystkiego przeniósłby 57 kB na ścieżkę krytyczną. -->
    <link rel="preload" href="/fonts/plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-mono-700-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
