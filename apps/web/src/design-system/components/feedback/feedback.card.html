<!DOCTYPE html><html><head><meta charset="utf-8">

<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--ink);padding:20px}
  .seclbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 9px}

</style></head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const NS = Object.values(window).find(o => o && typeof o === 'object' && o.Button && o.Card) || window;
const { Button, Badge, Avatar, Card, SegmentedControl, Switch, Alert, NavItem, StatCard, ProgressBar, AbsencePill } = NS;
const I = ({d,w=16,sw=1.9})=>(<svg width={w} height={w} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>);
const Demo = () => (<div className="col">
  <Alert variant="amber" icon={<I d="M12 3 1.5 21h21z M12 9v5 M12 17.5v.5" sw={2}/>} title="Masz 4 dni zaległego urlopu.">Wykorzystaj do 30.09.2026, aby nie przepadły.</Alert>
  <Alert variant="danger" solidIcon icon={<I d="M12 3 1.5 21h21z M12 9v5 M12 17.5v.5" sw={2.1}/>} title="Alert: kolizja kluczowych ról">Rafał i Marta są nieobecni jednocześnie 23–24.06.</Alert>
  <Alert variant="brand" solidIcon icon={<I d="M12 3l7.5 3v5.5c0 4.5-3.2 7.6-7.5 9-4.3-1.4-7.5-4.5-7.5-9V6z m-3 6 2 2 4-4"/>} title="Ochrona znacznika L4">Dostępna wyłącznie dla ról uprawnionych.</Alert>
</div>);
function Harness(){ const [s,set]=React.useState({}); window.__set=set; return <Demo state={s} set={set}/>; }
ReactDOM.createRoot(document.getElementById('root')).render(<Harness/>);
</script></body></html>
