<!-- @dsCard group="Components" viewport="700x260" name="Overlay — Dialog, Toast, Tooltip" subtitle="Modals, transient notices, hover hints" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--ink);padding:20px}
  .seclbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 9px}
  .wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .col{display:flex;flex-direction:column;gap:16px}
</style></head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const NS = Object.values(window).find(o => o && typeof o === 'object' && o.Button && o.Card) || window;
const { Button, Badge, Avatar, Card, Input, Select, SegmentedControl, Switch, Tabs, Breadcrumb, NavItem, Alert, StatCard, ProgressBar, AbsencePill, Table, Dialog, Toast, Tooltip } = NS;
const I = ({d,w=16,sw=1.9})=>(<svg width={w} height={w} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">{d}</svg>);
function Demo(){ const [open,setOpen]=React.useState(false);
 return (<div className="col">
  <div className="wrap" style={{gap:14}}>
    <Toast tone="brand" icon={<I d={<path d="M5 13l4 4L19 7"/>} sw={2.2}/>} title="Zapisano nieobecność">Balans zaktualizowany.</Toast>
    <Toast tone="amber" icon={<I d={<><path d="M12 3 1.5 21h21z"/><path d="M12 9v5M12 17.5v.5"/></>} sw={2}/>} title="Powiadomienie">Nowa nieobecność w zespole 26.06.</Toast>
  </div>
  <div className="wrap" style={{gap:18}}>
    <Button variant="secondary" onClick={()=>setOpen(true)}>Otwórz dialog</Button>
    <Tooltip label="Rola kluczowa"><span style={{display:'inline-flex',alignItems:'center',gap:7,fontSize:13,color:'var(--ink-2)'}}><span style={{width:8,height:8,borderRadius:'50%',background:'var(--amber)'}}/>Najedź na marker</span></Tooltip>
  </div>
  <Dialog open={open} onClose={()=>setOpen(false)} title="Usunąć wpis?" footer={<><Button variant="secondary" onClick={()=>setOpen(false)}>Anuluj</Button><Button variant="danger" onClick={()=>setOpen(false)}>Usuń</Button></>}>Tej operacji nie można cofnąć. Balans urlopu zostanie zaktualizowany.</Dialog>
 </div>); }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
