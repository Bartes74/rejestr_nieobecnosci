<!-- @dsCard group="Components" viewport="700x280" name="Forms — Input, Segmented" subtitle="Text fields and switchers" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--ink);padding:20px}
  .seclbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 9px}
  .wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .col{display:flex;flex-direction:column;gap:16px}
</style></head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const NS = Object.values(window).find(o => o && typeof o === 'object' && o.Button && o.Card) || window;
const { Button, Badge, Avatar, Card, Input, SegmentedControl, Alert, StatCard, ProgressBar, AbsencePill, Table, Dialog } = NS;
const I = ({d,w=16,sw=1.9})=>(<svg width={w} height={w} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">{d}</svg>);
function Demo(){ const [seg,setSeg]=React.useState('Sprint 13');
 return (<div className="col">
  <div className="wrap" style={{alignItems:'flex-end',gap:16}}>
    <Input label="Adres e-mail" icon={<I d={<path d="M3 5h18v14H3z M3 6l9 7 9-7"/>}/>} placeholder="anna.kowalska@firma.pl" style={{width:240}}/>
  </div>
  <div className="wrap" style={{gap:32}}>
    <div><div className="seclbl">Segmented</div><SegmentedControl options={['Tydzień','Sprint 13','Miesiąc']} value={seg} onChange={setSeg}/></div>
  </div>
 </div>); }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
