<!-- @dsCard group="Colors" viewport="700x170" name="Coverage Heatmap Scale" subtitle="Sequential risk: green (calm) → red (needs attention)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--ink);padding:18px 20px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{width:96px;height:54px;border-radius:10px;border:1px solid var(--border)}
  .nm{font-size:11px;font-weight:600;color:var(--ink-2)}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
  .lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin:0 0 12px}
</style></head><body><div class="row" style="gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--border);width:max-content">
  <div style="width:118px;height:56px;background:var(--heat-1);display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px;color:var(--heat-1-ink)">&lt;12%</div>
  <div style="width:118px;height:56px;background:var(--heat-2);display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px;color:var(--heat-2-ink)">12–24%</div>
  <div style="width:118px;height:56px;background:var(--heat-3);display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px;color:var(--heat-3-ink)">25–37%</div>
  <div style="width:118px;height:56px;background:var(--heat-4);display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px;color:var(--heat-4-ink)">38–49%</div>
  <div style="width:118px;height:56px;background:var(--heat-5);display:flex;align-items:flex-end;padding:6px;font-family:var(--font-mono);font-size:10px;color:var(--heat-5-ink)">≥50%</div>
</div>
<div style="margin-top:12px;font-size:12px;color:var(--muted)">Spokojnie&nbsp;&nbsp;→&nbsp;&nbsp;Wymaga uwagi</div></body></html>
