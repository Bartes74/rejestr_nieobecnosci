<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>

  .chip{width:96px;height:54px;border-radius:10px;border:1px solid var(--border)}
  .nm{font-size:11px;font-weight:600;color:var(--ink-2)}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
  .lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin:0 0 12px}
</style></head><body><div style="display:flex;flex-direction:column;gap:7px">
  <div style="display:flex;align-items:center;gap:12px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:78px">space-2</div><div style="height:14px;width:var(--space-2);background:var(--brand);border-radius:3px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2)">6px</div></div><div style="display:flex;align-items:center;gap:12px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:78px">space-3</div><div style="height:14px;width:var(--space-3);background:var(--brand);border-radius:3px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2)">8px</div></div><div style="display:flex;align-items:center;gap:12px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:78px">space-5</div><div style="height:14px;width:var(--space-5);background:var(--brand);border-radius:3px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2)">12px</div></div><div style="display:flex;align-items:center;gap:12px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:78px">space-7</div><div style="height:14px;width:var(--space-7);background:var(--brand);border-radius:3px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2)">16px</div></div><div style="display:flex;align-items:center;gap:12px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:78px">space-9</div><div style="height:14px;width:var(--space-9);background:var(--brand);border-radius:3px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2)">20px</div></div><div style="display:flex;align-items:center;gap:12px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:78px">space-12</div><div style="height:14px;width:var(--space-12);background:var(--brand);border-radius:3px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2)">24px</div></div><div style="display:flex;align-items:center;gap:12px"><div style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:78px">space-14</div><div style="height:14px;width:var(--space-14);background:var(--brand);border-radius:3px"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--ink-2)">28px</div></div>
</div></body></html>
