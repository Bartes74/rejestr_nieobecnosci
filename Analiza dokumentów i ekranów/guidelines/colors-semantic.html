<!-- @dsCard group="Colors" viewport="700x180" name="Semantic & Absence" subtitle="Amber=attention, danger=error/risk; absence is always uniform (D1/D2)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--ink);padding:18px 20px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{width:96px;height:54px;border-radius:10px;border:1px solid var(--border)}
  .nm{font-size:11px;font-weight:600;color:var(--ink-2)}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
  .lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin:0 0 12px}
</style></head><body><div class="row">
  <div class="sw"><div class="chip" style="background:var(--amber)"></div><div class="nm">amber</div><div class="hex">#B57E0F</div></div>
  <div class="sw"><div class="chip" style="background:var(--amber-tint)"></div><div class="nm">amber-tint</div><div class="hex">#F8EED4</div></div>
  <div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="nm">danger</div><div class="hex">#C81F2D</div></div>
  <div class="sw"><div class="chip" style="background:var(--danger-tint)"></div><div class="nm">danger-tint</div><div class="hex">#FAE4E6</div></div>
  <div class="sw"><div class="chip" style="background:var(--absence)"></div><div class="nm">absence</div><div class="hex">#CFE6DC</div></div>
  <div class="sw"><div class="chip" style="background:var(--absence-ink)"></div><div class="nm">absence-ink</div><div class="hex">#005C3F</div></div>
  <div class="sw"><div class="chip" style="background:var(--absence-border)"></div><div class="nm">absence-border</div><div class="hex">#A6D2BF</div></div>
</div></body></html>
