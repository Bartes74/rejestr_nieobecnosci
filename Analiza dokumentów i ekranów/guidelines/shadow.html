<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Restrained — sm for resting cards, shadow for elevated" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--ink);padding:18px 20px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{width:96px;height:54px;border-radius:10px;border:1px solid var(--border)}
  .nm{font-size:11px;font-weight:600;color:var(--ink-2)}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
  .lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin:0 0 12px}
</style></head><body><div class="row" style="gap:28px;padding:8px 4px">
  <div class="sw"><div style="width:150px;height:70px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm)"></div><div class="nm">shadow-sm</div></div>
  <div class="sw"><div style="width:150px;height:70px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)"></div><div class="nm">shadow</div></div>
</div></body></html>
