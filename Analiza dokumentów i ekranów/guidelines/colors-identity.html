<!-- @dsCard group="Colors" viewport="700x170" name="Visual Identity Palette" subtitle="Source Pantone swatches from the brand guidelines" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--ink);padding:18px 20px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{width:96px;height:54px;border-radius:10px;border:1px solid var(--border)}
  .nm{font-size:11px;font-weight:600;color:var(--ink-2)}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
  .lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin:0 0 12px}
</style></head><body><div class="row">
  <div class="sw"><div class="chip" style="background:var(--brand-p341)"></div><div class="nm">P341</div><div class="hex">#007A53</div></div>
  <div class="sw"><div class="chip" style="background:var(--brand-p342)"></div><div class="nm">P342</div><div class="hex">#006A4E</div></div>
  <div class="sw"><div class="chip" style="background:var(--brand-p7459)"></div><div class="nm">P7459</div><div class="hex">#4298B5</div></div>
  <div class="sw"><div class="chip" style="background:var(--brand-p646)"></div><div class="nm">P646</div><div class="hex">#5E8AB4</div></div>
  <div class="sw"><div class="chip" style="background:var(--brand-p276)"></div><div class="nm">P276</div><div class="hex">#221C35</div></div>
  <div class="sw"><div class="chip" style="background:var(--brand-p485)"></div><div class="nm">P485</div><div class="hex">#ED1B2F</div></div>
  <div class="sw"><div class="chip" style="background:var(--brand-p1215)"></div><div class="nm">P1215</div><div class="hex">#FBD872</div></div>
</div></body></html>
