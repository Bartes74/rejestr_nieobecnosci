<!-- @dsCard group="Spacing" viewport="700x170" name="Corner Radii" subtitle="Controls 10px · cards 14–16px · pills 20px" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--ink);padding:18px 20px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{width:96px;height:54px;border-radius:10px;border:1px solid var(--border)}
  .nm{font-size:11px;font-weight:600;color:var(--ink-2)}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
  .lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin:0 0 12px}
</style></head><body><div class="row">
  <div class="sw"><div style="width:90px;height:54px;background:var(--brand-tint);border:1px solid var(--brand-tint-2);border-radius:var(--radius-sm)"></div><div class="nm">radius-sm</div><div class="hex">7px</div></div><div class="sw"><div style="width:90px;height:54px;background:var(--brand-tint);border:1px solid var(--brand-tint-2);border-radius:var(--radius-md)"></div><div class="nm">radius-md</div><div class="hex">10px</div></div><div class="sw"><div style="width:90px;height:54px;background:var(--brand-tint);border:1px solid var(--brand-tint-2);border-radius:var(--radius-lg)"></div><div class="nm">radius-lg</div><div class="hex">14px</div></div><div class="sw"><div style="width:90px;height:54px;background:var(--brand-tint);border:1px solid var(--brand-tint-2);border-radius:var(--radius-xl)"></div><div class="nm">radius-xl</div><div class="hex">16px</div></div><div class="sw"><div style="width:90px;height:54px;background:var(--brand-tint);border:1px solid var(--brand-tint-2);border-radius:var(--radius-pill)"></div><div class="nm">radius-pill</div><div class="hex">20px</div></div>
</div></body></html>
