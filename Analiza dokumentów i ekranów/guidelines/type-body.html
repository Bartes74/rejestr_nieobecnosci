<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--ink);padding:18px 20px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{width:96px;height:54px;border-radius:10px;border:1px solid var(--border)}
  .nm{font-size:11px;font-weight:600;color:var(--ink-2)}

</style></head><body><div style="font-size:16px;font-weight:600;margin-bottom:8px">16 · medium — card titles</div>

<div style="font-size:13.5px;color:var(--ink-2);margin-bottom:8px">13.5 · secondary — table cells, list items</div>
<div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">12.5 · captions & helper text</div>
<div style="font-size:11px;color:var(--muted)">11 · micro labels</div></body></html>
