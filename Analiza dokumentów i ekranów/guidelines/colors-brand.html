<!-- @dsCard group="Colors" viewport="700x150" name="Brand / Primary" subtitle="Corporate teal-green — primary actions, active nav, key figures" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--ink);padding:18px 20px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{width:96px;height:54px;border-radius:10px;border:1px solid var(--border)}
  .nm{font-size:11px;font-weight:600;color:var(--ink-2)}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
  .lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin:0 0 12px}
</style></head><body><div class="row">
  <div class="sw"><div class="chip" style="background:var(--brand)"></div><div class="nm">brand</div><div class="hex">#007A53</div></div>
  <div class="sw"><div class="chip" style="background:var(--brand-dark)"></div><div class="nm">brand-dark · hover</div><div class="hex">#006A4E</div></div>
  <div class="sw"><div class="chip" style="background:var(--brand-tint)"></div><div class="nm">brand-tint</div><div class="hex">#E1F0E9</div></div>
  <div class="sw"><div class="chip" style="background:var(--brand-tint-2)"></div><div class="nm">brand-tint-2</div><div class="hex">#CFE6DC</div></div>
  <div class="sw"><div class="chip" style="background:var(--brand);display:flex;align-items:center;justify-content:center;color:var(--on-brand);font-weight:700;font-size:13px">Aa</div><div class="nm">on-brand</div><div class="hex">#FFFFFF</div></div>
</div></body></html>
