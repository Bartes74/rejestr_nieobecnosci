<!-- @dsCard group="Colors" viewport="700x320" name="Neutrals & Text" subtitle="Cool-warm greys with a faint green tint; never pure black/white" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--ink);padding:18px 20px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{display:flex;flex-direction:column;gap:6px}
  .chip{width:96px;height:54px;border-radius:10px;border:1px solid var(--border)}
  .nm{font-size:11px;font-weight:600;color:var(--ink-2)}
  .hex{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
  .lbl{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin:0 0 12px}
</style></head><body><div class="lbl">Surfaces</div><div class="row" style="margin-bottom:18px">
  <div class="sw"><div class="chip" style="background:var(--canvas)"></div><div class="nm">canvas</div><div class="hex">#EAEEEC</div></div>
  <div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="nm">surface</div><div class="hex">#FFFFFF</div></div>
  <div class="sw"><div class="chip" style="background:var(--surface-2)"></div><div class="nm">surface-2</div><div class="hex">#F5F8F6</div></div>
  <div class="sw"><div class="chip" style="background:var(--surface-3)"></div><div class="nm">surface-3</div><div class="hex">#EEF3F0</div></div>
  <div class="sw"><div class="chip" style="background:var(--border)"></div><div class="nm">border</div><div class="hex">#E1E7E4</div></div>
  <div class="sw"><div class="chip" style="background:var(--border-2)"></div><div class="nm">border-2</div><div class="hex">#D2DAD7</div></div>
</div>
<div class="lbl">Text</div><div class="row">
  <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="nm">ink</div><div class="hex">#15201C</div></div>
  <div class="sw"><div class="chip" style="background:var(--ink-2)"></div><div class="nm">ink-2</div><div class="hex">#3C4A45</div></div>
  <div class="sw"><div class="chip" style="background:var(--muted)"></div><div class="nm">muted</div><div class="hex">#6A7570</div></div>
</div></body></html>
