<!-- @dsCard group="Components" viewport="700x270" name="Core — Button, Badge, Avatar, Card" subtitle="Foundational primitives" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--ink);padding:20px}
  .seclbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 9px}
  .wrap{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .col{display:flex;flex-direction:column;gap:14px}
</style></head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
const NS = Object.values(window).find(o => o && typeof o === 'object' && o.Button && o.Card) || window;
const { Button, Badge, Avatar, Card, SegmentedControl, Switch, Alert, NavItem, StatCard, ProgressBar, AbsencePill } = NS;
const I = ({d,w=16,sw=1.9})=>(<svg width={w} height={w} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"><path d={d}/></svg>);
const Demo = () => (<div className="col">
  <div><div className="seclbl">Button — variants</div><div className="wrap">
    <Button variant="primary" icon={<I d="M12 5v14M5 12h14" sw={2}/>}>Zaplanuj</Button>
    <Button variant="secondary">Anuluj</Button>
    <Button variant="tint" icon={<I d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>}>Eksport .xlsx</Button>
    <Button variant="ghost">Kalendarz</Button>
    <Button variant="danger">Wycofaj</Button>
    <Button variant="primary" disabled>Disabled</Button>
  </div></div>
  <div className="wrap" style={{gap:24}}>
    <div><div className="seclbl">Badge</div><div className="wrap">
      <Badge tone="brand" mono>Sprint 13</Badge>
      <Badge tone="blue" dot>Aktywny</Badge>
      <Badge tone="amber">Zaplanowane</Badge>
      <Badge tone="danger">Przekroczono</Badge>
      <Badge tone="neutral">Zrealizowane</Badge>
    </div></div>
    <div><div className="seclbl">Avatar</div><div className="wrap">
      <Avatar initials="AK" tone="brand" size={34}/>
      <Avatar initials="MW" tone="blue" size={34}/>
      <Avatar initials="TL" tone="neutral" size={34}/>
    </div></div>
  </div>
</div>);
function Harness(){ const [s,set]=React.useState({}); window.__set=set; return <Demo state={s} set={set}/>; }
ReactDOM.createRoot(document.getElementById('root')).render(<Harness/>);
</script></body></html>
